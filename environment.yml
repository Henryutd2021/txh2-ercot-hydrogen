# conda env create -f environment.yml && conda activate txh2-framework && pip install -e .
# Pinned to the versions the tests were run with (Python 3.12).
name: txh2-framework
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy==2.5.4
      - pandas==3.1.0
      - xarray==2026.9.0
      - linopy==0.10.1
      - highspy==1.15.1
      - pytest==9.2.0
      # optional, for large instances (needs a licence):
      # - gurobipy
