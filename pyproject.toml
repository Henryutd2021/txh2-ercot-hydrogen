[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "txh2-framework"
version = "1.0.2"
description = "Two-stage stochastic planning of electrolyzers, hydrogen storage, fuel cells and inter-zone pipelines in a renewable-rich power system (framework of Li & Zhang, IJHE 2025)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Honglin Li"}]
requires-python = ">=3.10"
# Lower bounds = oldest versions the test suite was run with (and passed); newest tested: see environment.yml
dependencies = ["numpy>=1.26", "pandas>=2.2", "xarray>=2024.6", "linopy>=0.4.4", "highspy>=1.7.2"]
keywords = ["hydrogen", "renewable energy", "ERCOT", "stochastic optimization", "energy system planning"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
gurobi = ["gurobipy"]
test = ["pytest"]

[project.scripts]
txh2-framework = "txh2_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
